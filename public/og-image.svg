<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="0.5"/>
  </g>
  <!-- Product name -->
  <text x="600" y="275" 
        font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" 
        fill="white" text-anchor="middle" filter="url(#glow)">Timestamp Converter Pro</text>
  <!-- Tagline -->
  <text x="600" y="345" 
        font-family="Arial, Helvetica, sans-serif" font-size="28" 
        fill="rgba(255,255,255,0.85)" text-anchor="middle">Convert between Unix timestamps, ISO dates, and human-readable formats instantly</text>
  <!-- Price badge -->
  <rect x="520" y="385" width="160" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="600" y="420" 
        font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold"
        fill="white" text-anchor="middle">$19</text>
  <!-- Footer -->
  <text x="600" y="590" 
        font-family="Arial, Helvetica, sans-serif" font-size="20" 
        fill="rgba(255,255,255,0.5)" text-anchor="middle">UniverseCreator — Developer Tools</text>
</svg>